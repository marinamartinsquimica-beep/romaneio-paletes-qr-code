<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Início - Romaneio Paletes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e1e1e">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 18%,rgba(255,193,7,.24),transparent 30%),linear-gradient(145deg,#0f1720 0%,#1e1e1e 48%,#111827 100%);display:flex;align-items:center;justify-content:center;font-family:Arial,Roboto,sans-serif;color:#fff;overflow:hidden;transition:opacity 1.1s ease}.card{width:min(86vw,380px);padding:34px 28px;border-radius:34px;text-align:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);box-shadow:0 28px 80px rgba(0,0,0,.35);backdrop-filter:blur(16px);animation:cardIn 1s ease}.logo-wrap{width:190px;height:190px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 65%);box-shadow:0 0 45px rgba(255,193,7,.32)}.logo{width:175px;height:175px;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(0,0,0,.28));animation:float 3s ease-in-out infinite}h1{margin:22px 0 8px;font-size:34px;letter-spacing:.5px}p{margin:0;color:rgba(255,255,255,.72);font-size:15px}.bar{height:10px;margin-top:30px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.18)}.bar:after{content:"";display:block;width:42%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#0875f5,#ffc107,#2eba4f);animation:loading 1.2s ease-in-out infinite}.version{margin-top:22px;display:inline-block;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.10);color:rgba(255,255,255,.72);font-size:12px}@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes loading{0%{transform:translateX(-110%)}100%{transform:translateX(250%)}}
</style>
</head>
<body id="tela"><div class="card"><div class="logo-wrap"><img src="icon-512.png" class="logo" alt="Ícone Marina"></div><h1>Romaneio Paletes</h1><p>Carregando sistema local</p><div class="bar"></div><span class="version">Dados salvos no aparelho</span></div><script>setTimeout(()=>{document.getElementById('tela').style.opacity='0';setTimeout(()=>{window.location.href='index.html'},1100)},2600);if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{})}</script></body></html>
